
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b12">
    <title>Login | LOCATION.SYS</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.2/css/bulma.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;
            --bg: #080b12;
            --panel: #101622;
            --border: rgba(148, 163, 184, 0.17);
            --text: #edf2fb;
            --muted: #8591a8;
            --accent: #62e6c5;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at 50% 0%, rgba(70, 108, 184, 0.17), transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(45, 179, 145, 0.08), transparent 40%),
                var(--bg);
        }

        .background-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.15;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.12) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: linear-gradient(to bottom, black, transparent 85%);
        }

        .login-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            animation: appear 450ms ease both;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            color: var(--accent);
            border: 1px solid rgba(98, 230, 197, 0.23);
            background: rgba(98, 230, 197, 0.08);
            border-radius: 13px;
        }

        .brand-icon svg {
            width: 24px;
            height: 24px;
        }

        .brand-name {
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .brand-name span {
            color: var(--accent);
        }

        .brand-caption {
            margin-top: 3px;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 1.3px;
            text-transform: uppercase;
        }

        .login-card {
            padding: 34px;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: rgba(16, 22, 34, 0.91);
            box-shadow: 0 24px 90px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(18px);
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            color: var(--accent);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 20px;
            height: 1px;
            background: var(--accent);
        }

        .login-title {
            margin: 0 0 10px;
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .login-description {
            margin-bottom: 29px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .field {
            margin-bottom: 20px;
            text-align: left;
        }

        .field-label {
            display: block;
            margin-bottom: 9px;
            color: #c5cede;
            font-size: 12px;
            font-weight: 600;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            width: 18px;
            height: 18px;
            transform: translateY(-50%);
            color: #75829a;
            pointer-events: none;
        }

        .input {
            width: 100%;
            height: 49px;
            padding: 0 44px;
            border: 1px solid var(--border);
            border-radius: 11px;
            outline: none;
            background: rgba(5, 9, 16, 0.58);
            box-shadow: none;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: border-color 180ms ease, box-shadow 180ms ease;
        }

        .input::placeholder {
            color: #647086;
        }

        .input:hover {
            border-color: rgba(148, 163, 184, 0.35);
        }

        .input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(98, 230, 197, 0.09);
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            display: grid;
            place-items: center;
            padding: 5px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #75829a;
            cursor: pointer;
        }

        .password-toggle:hover {
            color: var(--accent);
        }

        .password-toggle svg {
            width: 18px;
            height: 18px;
        }

        .login-button {
            width: 100%;
            height: 49px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
            border: 1px solid rgba(98, 230, 197, 0.35);
            border-radius: 11px;
            background: var(--accent);
            color: #071510;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 180ms ease, background 180ms ease,
                box-shadow 180ms ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
            background: #7af0d2;
            box-shadow: 0 8px 26px rgba(98, 230, 197, 0.13);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:focus-visible,
        .password-toggle:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .login-button svg {
            width: 17px;
            height: 17px;
        }

        .security-note {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            margin-top: 23px;
            color: var(--muted);
            font-size: 10px;
            line-height: 1.6;
            text-align: center;
        }

        .security-note svg {
            flex-shrink: 0;
            width: 14px;
            height: 14px;
            color: var(--accent);
        }

        .footer {
            margin-top: 24px;
            color: #647086;
            font-size: 10px;
            text-align: center;
            letter-spacing: 0.3px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 18px;
            }

            .login-card {
                padding: 27px 22px;
                border-radius: 18px;
            }

            .login-title {
                font-size: 29px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="background-grid" aria-hidden="true"></div>

    <main class="login-wrapper">

        <div class="brand">
            <div class="brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
                    <circle cx="12" cy="10" r="2.5"/>
                </svg>
            </div>

            <div>
                <div class="brand-name">LOCATION<span>.SYS</span></div>
                <div class="brand-caption">Tracking dashboard</div>
            </div>
        </div>

        <!-- Original backend endpoint and field names preserved -->
        <form class="login-card" action="/login" method="post">

            <div class="eyebrow">Restricted access</div>

            <h1 class="login-title">Welcome back.</h1>

            <p class="login-description">
                Sign in with your credentials to access the tracking dashboard.
            </p>

            <div class="field">
                <label class="field-label" for="username">Username</label>

                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.7"
                        stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                    </svg>

                    <input
                        id="username"
                        type="text"
                        class="input"
                        placeholder="Enter your username"
                        required
                        name="username"
                        autocomplete="username">
                </div>
            </div>

            <div class="field">
                <label class="field-label" for="password">Password</label>

                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.7"
                        stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <rect x="4" y="10" width="16" height="11" rx="2"/>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                    </svg>

                    <input
                        id="password"
                        type="password"
                        class="input"
                        placeholder="Enter your password"
                        required
                        name="password"
                        autocomplete="current-password">

                    <button
                        class="password-toggle"
                        type="button"
                        id="toggle-password"
                        aria-label="Show password"
                        aria-pressed="false">

                        <svg id="eye-icon" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.7"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">
                <span>Sign in to dashboard</span>

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14M13 6l6 6-6 6"/>
                </svg>
            </button>

            <div class="security-note">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <rect x="5" y="10" width="14" height="11" rx="2"/>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                </svg>

                <span>Authorized credentials required</span>
            </div>

        </form>

        <footer class="footer">
            LOCATION.SYS &bull; Tracking interface
        </footer>

    </main>

    <script>
        // UI-only password visibility toggle. No backend changes.
        const passwordInput = document.querySelector("#password");
        const toggleButton = document.querySelector("#toggle-password");
        const eyeIcon = document.querySelector("#eye-icon");

        toggleButton.addEventListener("click", () => {
            const showPassword = passwordInput.type === "password";

            passwordInput.type = showPassword ? "text" : "password";
            toggleButton.setAttribute("aria-pressed", String(showPassword));
            toggleButton.setAttribute(
                "aria-label",
                showPassword ? "Hide password" : "Show password"
            );

            eyeIcon.innerHTML = showPassword
                ? '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-4 4.7"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10.5 10.5 0 0 0 3-.4"/>'
                : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
        });
    </script>

</body>
</html>
